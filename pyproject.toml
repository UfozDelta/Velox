[project]
name = "f3l"
version = "0.2.0"
description = "Command-line trading for crypto futures: limit/market/stop orders, ladders, chase, TWAP, VWAP and trailing stops."
authors = [
    {name = "syagrovs",email = "max.syagrovskyy@mail.utoronto.ca"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32.3,<3.0.0)",
    "click (>=8.1.8,<9.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "tabulate (>=0.9.0,<0.10.0)"
]

[tool.poetry]
packages = [{include = "f3l", from = "src"}]

[tool.poetry.scripts]
f3l = "f3l.cli:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
